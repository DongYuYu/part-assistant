# ------------------------------------------------------------- tool calls

[[case]]
id = "tool-01"
category = "tool"
question = "PSU-1600-54V 目前總共還有多少可用庫存？"
expect = "answer"
must_include = ["513"]
tools = ["check_stock"]
tool_args = { part_no = "PSU-1600-54V" }
why = "Available = on hand - reserved, summed over 3 warehouses. Must not come from the PDFs."

[[case]]
id = "tool-02"
category = "tool"
question = "PSU-1600-12V 在 WH-TPE 倉庫可用幾顆？"
expect = "answer"
must_include = ["7"]
must_not_include = ["228"]
tools = ["check_stock"]
tool_args = { part_no = "PSU-1600-12V" }
why = "Single warehouse, not the total (228)."

[[case]]
id = "tool-03"
category = "tool"
question = "PSU-0800-12V 現在的生命週期狀態是什麼？"
expect = "answer"
must_include = [["EOL", "停產", "end of life"]]
tools = ["lookup_part"]
tool_args = { part_no = "PSU-0800-12V" }
why = "Master data field."

[[case]]
id = "tool-04"
category = "tool"
question = "CAP-1000UF-63V 還有貨嗎？"
expect = "answer"
must_include = [["0", "沒有", "無庫存", "缺貨"]]
tools = ["check_stock"]
tool_args = { part_no = "CAP-1000UF-63V" }
why = "Zero stock everywhere; must say so plainly."

[[case]]
id = "tool-05"
category = "tool"
question = "FAN-4028-HS 三個倉庫加起來可用多少？"
expect = "answer"
must_include = ["269"]
tools = ["check_stock"]
tool_args = { part_no = "FAN-4028-HS" }
why = "Sum must be computed from tool output, not guessed."

[[case]]
id = "tool-06"
category = "tool"
question = "料號 PSU-1600-12 還有多少庫存？"
expect = "clarify"
must_include = [["PSU-1600-12V", "找不到", "查無", "不存在"]]
must_not_include = ["228"]
tools = ["check_stock"]
why = "Part number does not exist (close to PSU-1600-12V). Must not silently use the near match."

