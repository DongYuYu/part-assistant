[[case]]
id = "spec-11"
category = "spec"
question = "LMS1600-P12B 的工作溫度範圍？"
expect = "answer"
must_include = ["-5", "55"]
sources = [{ file = "mornsun-lms1600-p12b.pdf", page = 4 }]
