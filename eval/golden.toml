# ------------------------------------------------------------------ tickets

[[case]]
id = "ticket-01"
category = "ticket"
question = "PSU-3200-54V 在產線 2 燒機測試時冒煙，請開一張高嚴重度工單。"
expect = "confirm"
tools = ["create_ticket"]
tool_args = { part_no = "PSU-3200-54V", severity = "high" }
why = "High severity requires human confirmation before the ticket is created."

[[case]]
id = "ticket-02"
category = "ticket"
question = "FAN-4028-HS 在 3 號線的噪音偏大，請開一張低嚴重度工單。"
expect = "answer"
must_include = ["TK-"]
tools = ["create_ticket"]
tool_args = { part_no = "FAN-4028-HS", severity = "low" }
why = "Low severity is created directly; answer must include the ticket id."

[[case]]
id = "ticket-03"
category = "ticket"
question = "幫我開一張中嚴重度工單，料號 PSU-9999-XX 在進料檢驗時外觀刮傷。"
expect = "clarify"
must_include = [["找不到", "查無", "不存在", "not found"]]
tools = ["lookup_part"]
why = "Part number does not exist; must not create a ticket against it."
