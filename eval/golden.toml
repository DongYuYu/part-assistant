# Golden set: questions with human-verified answers.
#
# Every expected answer was checked against the PDF page (rendered image for the
# hard tables), or against the seeded SQLite data. Do not let a model write or
# "fix" these answers.
#
# Fields
#   id               unique, stable (eval history refers to it)
#   category         spec | table | footnote | similar | tool | multi | refuse | clarify | ticket
#   question         what a user would type (mostly Traditional Chinese, some English)
#   expect           answer | refuse | clarify | confirm
#   must_include     list of groups; each group is a string or a list of alternatives.
#                    Matching ignores case and whitespace. Every group must match.
#   must_not_include strings that must NOT appear (e.g. the similar model's value)
#   sources          where the answer lives: [{file, page}]  (retrieval + citation scoring)
#   tools            tools the agent is expected to call (order-insensitive)
#   tool_args        expected arguments for the single key tool call
#   known_issue      the current pipeline is expected to fail this; reason + what to fix
#   why              what this case is testing

# ---------------------------------------------------------------- spec lookup

[[case]]
id = "spec-01"
category = "spec"
question = "TEC3200-54 的主輸出電壓是多少？"
expect = "answer"
must_include = [["54 V", "54V", "54 VDC"]]
sources = [{ file = "bel-tec3200-54.pdf", page = 1 }, { file = "bel-tec3200-54.pdf", page = 3 }]
why = "Basic fact on the cover page."

[[case]]
id = "spec-02"
category = "spec"
question = "CSU2400AT 的 MTBF 是多少？"
expect = "answer"
must_include = [["400 k", "400k", "400,000", "40萬", "400000"]]
sources = [{ file = "ae-csu2400at.pdf", page = 2 }]
why = "Value in the environmental table."

[[case]]
id = "spec-03"
category = "spec"
question = "CSU2400AT 在低壓輸入（90 到 132 VAC）時最多可以輸出多少功率？"
expect = "answer"
must_include = [["1400 W", "1400W", "1,400"]]
sources = [{ file = "ae-csu2400at.pdf", page = 2 }]
why = "Output power depends on input range; must pick the low-line value."

[[case]]
id = "spec-04"
category = "spec"
question = "TEC1600 的重量是多少？"
expect = "answer"
must_include = [["740 g", "740g", "740 公克"]]
sources = [{ file = "bel-tec1600.pdf", page = 43 }]
why = "Fact near the end of a 56-page document."

[[case]]
id = "spec-05"
category = "spec"
question = "LMS800-P12B 的外形尺寸是多少？"
expect = "answer"
must_include = ["73.5", "185"]
sources = [{ file = "mornsun-lms800-p12b.pdf", page = 4 }]
