# ------------------------------------------------------------ hard tables

[[case]]
id = "table-01"
category = "table"
question = "TEC3200 在 50% 負載時的效率是多少？"
expect = "answer"
must_include = ["96"]
sources = [{ file = "bel-tec3200-54.pdf", page = 2 }]
why = "Borderless table with merged 'Efficiency' cell."

[[case]]
id = "table-02"
category = "table"
question = "TEC3200 在 10% 負載時的效率是多少？"
expect = "answer"
must_include = ["90"]
must_not_include = ["15%"]
sources = [{ file = "bel-tec3200-54.pdf", page = 2 }]
why = "First row of a centered merged cell; forward-fill would label it iTHD (15%)."

[[case]]
id = "table-03"
category = "table"
question = "TEC3200 輸出 2700W 時的 hold-up time 是多少？"
expect = "answer"
must_include = [["10 ms", "10ms", "10 毫秒"]]
sources = [{ file = "bel-tec3200-54.pdf", page = 2 }]
why = "Last row of a merged group; 9 ms is the 3200 W value."

[[case]]
id = "table-04"
category = "table"
question = "CSU1600AT 在 100% 負載時的效率是多少？"
expect = "answer"
must_include = ["91"]
sources = [{ file = "ae-csu1600at.pdf", page = 7 }]
why = "Four conditions and four values packed in single cells ('90 94 96 91')."

[[case]]
id = "table-05"
category = "table"
question = "LMS2700-T12B 在 20% 負載時的效率是多少？"
expect = "answer"
must_include = ["94"]
sources = [{ file = "mornsun-lms2700-t12b.pdf", page = 1 }]
known_issue = "Parser drops the 10%/20% rows of this table (verified on page image: 90 / 94)."
why = "Regression target for the parser."

[[case]]
id = "table-06"
category = "table"
question = "LMS2700-T12B 在 230Vac、輸出 2700W 時的最大輸入電流是多少？"
expect = "answer"
must_include = [["15 A", "15A", "15 安培"]]
sources = [{ file = "mornsun-lms2700-t12b.pdf", page = 1 }]
known_issue = "Parser forward-fills this row as 'Efficiency' instead of 'Input Current'."
why = "Wrong parameter name from a fallback guess."

[[case]]
id = "table-07"
category = "table"
question = "LMS800-P12B 在 115VAC 輸入、50% 負載時的效率是多少？"
expect = "answer"
must_include = ["92"]
sources = [{ file = "mornsun-lms800-p12b.pdf", page = 1 }]
why = "Same table has a 230VAC block (94% at 50%); the condition must be respected."

[[case]]
id = "table-08"
category = "table"
question = "TEC3200 在 100% 負載時的 iTHD 上限是多少？"
expect = "answer"
must_include = ["5"]
sources = [{ file = "bel-tec3200-54.pdf", page = 2 }]
why = "Parameter name wrapped over two lines ('iTHD' / '(Total Harmonic Distortion)')."

# --------------------------------------------------------------- footnotes

[[case]]
id = "footnote-01"
category = "footnote"
question = "CSU2400AT 主輸出的最小負載要求是多少？"
expect = "answer"
must_include = ["5%"]
sources = [{ file = "ae-csu2400at.pdf", page = 2 }]
why = "Table says '0 A' with footnote 1: minimum loading is 5% of rated current."

[[case]]
id = "footnote-02"
category = "footnote"
question = "TEC1600 在低壓（low line）輸入時最大輸出功率是多少？"
expect = "answer"
must_include = [["1000 W", "1000W", "1,000"]]
sources = [{ file = "bel-tec1600.pdf", page = 3 }]
why = "Stated in a table cell and repeated in footnote 6."

[[case]]
id = "footnote-03"
category = "footnote"
question = "CSU2400AT 的均流誤差 ±4% 適用於什麼負載範圍？"
expect = "answer"
must_include = ["5%", "100%"]
sources = [{ file = "ae-csu2400at.pdf", page = 2 }]
why = "Footnote 2 is attached to the parameter name 'Current Sharing Error (CSE)', not a value."

[[case]]
id = "footnote-04"
category = "footnote"
question = "CSU2400AT 如果要用 cold redundancy，需要多少外部電容？"
expect = "answer"
must_include = [["2,000", "2000"]]
sources = [{ file = "ae-csu2400at.pdf", page = 2 }]
why = "Table shows 3,000 µF minimum; footnote 3 adds the 2,000 µF cold-redundancy rule."

