[project]
name = "part-assistant"
version = "0.1.0"
description = "Factory knowledge Q&A and work-order agent (RAG + tool use + MCP)"
readme = "README.md"
authors = [
    { name = "Dong Yu Yu" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "starlette>=1.10.0",
    "torch>=2.11.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
part-assistant = "part_assistant:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Seed data tables read better as one row per line.
"src/part_assistant/seed.py" = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# torch must come from PyTorch's own index: the cu128 build is the first to support
# Blackwell GPUs (RTX 50xx). explicit = true: only torch is looked up there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
